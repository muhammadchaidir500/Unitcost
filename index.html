<script>
(function(){
"use strict";
const SEED = JSON.parse(document.getElementById('seed').textContent);
const CLASS_LABELS = SEED.classLabels;
const LS_KEY = 'tdabc_v1';

// ---------- state ----------
let TND, BMHP, DD, MM, VOL, S, view='ringkasan', manualOpen=0, selTarif=null, selTnd=null, tndDraft=null, bmhpDraft=null, fl={q:'',kelompok:'all'}, flB={q:'',jenis:'all'};

function freshState(){
  return {
    tnd: SEED.tindakan.map(t=>({...t, te:t.te.slice(), margin:SEED.classMargins.slice()})),
    bmhp: SEED.bmhp.map(b=>({...b})),
    dd: SEED.dataDasar.map(s=>({key:s.key,title:s.title,items:s.items.map(i=>({...i}))})),
    mm: SEED.massaManfaat.map(m=>({...m})),
    vol: SEED.volumeUnit.map(v=>({...v})),
    settings: {classMargins: SEED.classMargins.slice()},
    meta: {hospital: SEED.hospital, tahun: SEED.tahun, importedAt: null, importedName: null}
  };
}
let META;
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const o = JSON.parse(raw);
      TND=o.tnd; BMHP=o.bmhp; DD=o.dd; MM=o.mm||SEED.massaManfaat; VOL=o.vol||SEED.volumeUnit; S=o.settings; META=o.meta||{hospital:SEED.hospital,tahun:SEED.tahun};
      return;
    }
  }catch(e){}
  const f=freshState(); TND=f.tnd; BMHP=f.bmhp; DD=f.dd; MM=f.mm; VOL=f.vol; S=f.settings; META=f.meta;
}
function persist(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({tnd:TND,bmhp:BMHP,dd:DD,mm:MM,vol:VOL,settings:S,meta:META})); }
  catch(e){ toast('Penyimpanan perangkat penuh, sebagian perubahan mungkin tidak tersimpan.'); }
}
function resetAll(){
  const f=freshState(); TND=f.tnd; BMHP=f.bmhp; DD=f.dd; MM=f.mm; VOL=f.vol; S=f.settings; META=f.meta;
  persist(); render(); toast('Data dikembalikan ke bawaan awal.');
}

// ---------- format helpers ----------
const nf=new Intl.NumberFormat('id-ID');
const rp=v=>'Rp '+nf.format(Math.round(v||0));
const rpS=v=>{v=v||0;const a=Math.abs(v);if(a>=1e9)return 'Rp '+(v/1e9).toLocaleString('id-ID',{maximumFractionDigits:2})+' M';if(a>=1e6)return 'Rp '+(v/1e6).toLocaleString('id-ID',{maximumFractionDigits:1})+' jt';if(a>=1e3)return 'Rp '+(v/1e3).toLocaleString('id-ID',{maximumFractionDigits:1})+' rb';return rp(v)};
const pct=(v,d=0)=>((v||0)*100).toLocaleString('id-ID',{maximumFractionDigits:d,minimumFractionDigits:d})+'%';
const num=(v,d=1)=>(+v||0).toLocaleString('id-ID',{maximumFractionDigits:d});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:0;
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

// ---------- compute ----------
function uc(t){ return (+t.sdm||0)+(+t.sarana||0)+(+t.bmhp||0)+(+t.oh||0); }
function classCalc(t,ci){
  const u=uc(t), margin = (t.margin&&t.margin[ci]!=null)?t.margin[ci]:S.classMargins[ci];
  const te = t.te[ci];
  const usulan = u*(1+(margin||0));
  const selisih = te!=null ? te-u : null;
  const crr = (te!=null && u) ? te/u : null;
  const ket = te==null ? 'Isi tarif eksisting' : (crr>=1 ? 'Surplus / impas' : 'Defisit (tarif < biaya)');
  return {margin,te,usulan,selisih,crr,ket};
}
function kelompokList(){ return [...new Set(TND.map(t=>t.kelompok))].sort(); }
function rekapLive(){
  const g={};
  TND.forEach(t=>{
    const u=uc(t); const k=t.kelompok||'-';
    (g[k]=g[k]||{n:0,ucs:[],pS:0,pR:0,pB:0,pO:0});
    const o=g[k]; o.n++; o.ucs.push(u);
    if(u){ o.pS+=t.sdm/u; o.pR+=t.sarana/u; o.pB+=t.bmhp/u; o.pO+=t.oh/u; }
  });
  return Object.entries(g).map(([k,o])=>({kelompok:k,n:o.n,min:Math.min(...o.ucs),avg:avg(o.ucs),max:Math.max(...o.ucs),pSdm:o.pS/o.n,pSarana:o.pR/o.n,pBmhp:o.pB/o.n,pOverhead:o.pO/o.n})).sort((a,b)=>b.n-a.n);
}

    <p>Setelah proses selesai, notifikasi akan menampilkan jumlah data yang diperbarui/ditambahkan.</p>`},
  {t:'Mengedit margin &amp; tarif eksisting', b:`

    <button class="btn" data-resetall="1" style="color:var(--bad)">Kembalikan ke data bawaan</button></div>`;

// ---------- render ----------
function render(){
  document.querySelectorAll('.nav button[data-go]').forEach(b=>b.setAttribute('aria-current',b.dataset.go===view?'page':'false'));
  const V={ringkasan:vRingkasan,tarif:vTarif,tindakan:vTindakan,bmhp:vBmhp,datadasar:vDataDasar,rekap:vRekap,impor:vImpor,manual:vManual,pengaturan:vPengaturan}[view];
  document.getElementById('view').innerHTML = V ? V() : vRingkasan();
  const dr=document.getElementById('drawer');
  if(selTarif && !dr.hidden){ document.getElementById('sheet').innerHTML = tarifDrawer(selTarif); }
}

// ---------- excel export ----------
function xlsxDownload(rows, sheetName, fileName){
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  const out = XLSX.write(wb,{type:'array',bookType:'xlsx'});
  saveFile(fileName, out, 'application/octet-stream');
}
function exportBmhp(){
  const rows=[['No','Nama Obat / BMHP','Satuan','Harga Satuan (Rp)','Jenis','Lokasi / Pemakai']];
  BMHP.forEach(b=>rows.push([b.no,b.nama,b.satuan,Math.round(b.harga||0),b.jenis,b.lokasi]));
  xlsxDownload(rows,'MasterBMHP','master-obat-bmhp-'+slug(META.hospital)+'.xlsx');
}
function exportTarif(){
  const rows=[['No','Kode','Nama Tindakan','Kelompok','Subkelompok','Dokter','Kasus Acuan','Biaya SDM (Rp)','Biaya Sarana (Rp)','Biaya Obat & BMHP (Rp)','Overhead (Rp)','TOTAL UNIT COST (Rp)',
    ...CLASS_LABELS.flatMap(l=>['Margin '+l,'Tarif Eksisting '+l+' (Rp)'])]];
  TND.forEach(t=>{
    const row=[t.no,t.kode,t.nama,t.kelompok,t.sub||'',t.dokter||'',t.acuan||'',Math.round(t.sdm||0),Math.round(t.sarana||0),Math.round(t.bmhp||0),Math.round(t.oh||0),Math.round(uc(t))];
    CLASS_LABELS.forEach((l,ci)=>{ row.push(t.margin[ci]); row.push(t.te[ci]!=null?Math.round(t.te[ci]):''); });
    rows.push(row);
  });
  xlsxDownload(rows,'BukuTarif','buku-tarif-'+slug(META.hospital)+'.xlsx');
}

// ---------- excel import ----------
function normH(s){ return String(s==null?'':s).trim().toLowerCase(); }
function sheetToAoa(wb,name){ return XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:null,raw:true}); }
function findCol(headerRow, patterns){
  for(let c=0;c<headerRow.length;c++){ const h=normH(headerRow[c]); if(patterns.test(h)) return c; }
  return -1;
}
function findAllCols(headerRow, pattern){
  const out=[]; for(let c=0;c<headerRow.length;c++){ if(pattern.test(normH(headerRow[c]))) out.push(c); } return out;
}
async function importFile(file){
  let wb; try{ const buf=await file.arrayBuffer(); wb = XLSX.read(buf,{type:'array'}); }catch(e){ toast('File tidak dapat dibaca.'); return; }
  let bmhpUpd=0,bmhpAdd=0,tndUpd=0,tndAdd=0,ddUpd=0;
  const ddLabels={}; DD.forEach(sec=>sec.items.forEach((it,i)=>{ ddLabels[normH(it.label)] = {sec:sec.key, idx:i}; }));

  wb.SheetNames.forEach(sn=>{
    let aoa; try{ aoa = sheetToAoa(wb,sn); }catch(e){ return; }
    if(!aoa || !aoa.length) return;
    // scan first 10 rows for header candidates
    for(let hr=0; hr<Math.min(10,aoa.length); hr++){
      const row=aoa[hr]||[]; const norm=row.map(normH);
      const hasNama = norm.some(h=>/nama/.test(h));
      const hasHarga = norm.some(h=>/harga/.test(h));
      const hasKode = norm.some(h=>/^kode$/.test(h)||/kode/.test(h));
      const hasNamaTindakan = norm.some(h=>/nama tindakan/.test(h));
      if(hasKode && hasNamaTindakan){
        const cKode=findCol(row,/kode/), cNama=findCol(row,/nama tindakan/), cKel=findCol(row,/kelompok/),
          cSub=findCol(row,/subkelompok/), cDok=findCol(row,/dokter/), cAcu=findCol(row,/kasus acuan/),
          cSdm=findCol(row,/sdm/), cSar=findCol(row,/sarana/), cBm=findCol(row,/bmhp|obat/), cOh=findCol(row,/overhead/),
          cUc=findCol(row,/unit cost/);
        const marginCols=findAllCols(row,/margin/), teCols=findAllCols(row,/tarif eksisting/);
        for(let r=hr+1;r<aoa.length;r++){
          const rr=aoa[r]||[]; const kode=cKode>=0?rr[cKode]:null; if(!kode) continue;
          let t=TND.find(x=>String(x.kode)===String(kode));
          const isNew=!t;
          if(isNew){ t={no:TND.length+1,kode:String(kode),nama:'',kelompok:'',sub:null,dokter:null,acuan:null,sdm:0,sarana:0,bmhp:0,oh:0,te:[null,null,null,null,null],margin:S.classMargins.slice()}; TND.push(t); }
          if(cNama>=0 && rr[cNama]!=null) t.nama=String(rr[cNama]);
          if(cKel>=0 && rr[cKel]!=null) t.kelompok=String(rr[cKel]);
          if(cSub>=0 && rr[cSub]!=null) t.sub=String(rr[cSub]);
          if(cDok>=0 && rr[cDok]!=null) t.dokter=String(rr[cDok]);
          if(cAcu>=0 && rr[cAcu]!=null) t.acuan=String(rr[cAcu]);
          if(cSdm>=0 && typeof rr[cSdm]==='number') t.sdm=rr[cSdm];
          if(cSar>=0 && typeof rr[cSar]==='number') t.sarana=rr[cSar];
          if(cBm>=0 && typeof rr[cBm]==='number') t.bmhp=rr[cBm];
          if(cOh>=0 && typeof rr[cOh]==='number') t.oh=rr[cOh];
          marginCols.slice(0,5).forEach((c,ci)=>{ if(typeof rr[c]==='number') t.margin[ci]=rr[c]; });
          teCols.slice(0,5).forEach((c,ci)=>{ if(typeof rr[c]==='number') t.te[ci]=rr[c]; });
          if(isNew) tndAdd++; else tndUpd++;
        }
        break;
      }
      if(hasNama && hasHarga && !hasKode){
        const cNama=findCol(row,/nama/), cSat=findCol(row,/satuan/), cHarga=findCol(row,/harga/), cJenis=findCol(row,/jenis/), cLok=findCol(row,/lokasi/);
        for(let r=hr+1;r<aoa.length;r++){
          const rr=aoa[r]||[]; const nama=cNama>=0?rr[cNama]:null; if(!nama) continue;
          let b=BMHP.find(x=>normH(x.nama)===normH(nama));
          const isNew=!b;
          if(isNew){ b={no:BMHP.length+1,nama:String(nama),satuan:null,harga:0,jenis:null,lokasi:null}; BMHP.push(b); }
          if(cSat>=0 && rr[cSat]!=null) b.satuan=String(rr[cSat]);
          if(cHarga>=0 && typeof rr[cHarga]==='number') b.harga=rr[cHarga];
          if(cJenis>=0 && rr[cJenis]!=null) b.jenis=String(rr[cJenis]);
          if(cLok>=0 && rr[cLok]!=null) b.lokasi=String(rr[cLok]);
          if(isNew) bmhpAdd++; else bmhpUpd++;
        }
        break;
      }
    }
    // data dasar: label match in column B or A, scan only reasonably small sheets
    if(aoa.length<=200){
      for(let r=0;r<aoa.length;r++){
        const rr=aoa[r]||[];
        for(let c=0;c<Math.min(3,rr.length);c++){
          const key=normH(rr[c]);
          if(key && ddLabels[key]){
            const val=rr[c+1];
            if(val!=null && val!==''){
              const {sec,idx}=ddLabels[key];
              const secObj=DD.find(s=>s.key===sec);
              if(secObj){ secObj.items[idx].val = typeof val==='number' ? val : String(val); ddUpd++; }
            }
          }
        }
      }
    }
  });
  META.importedAt=Date.now(); META.importedName=file.name;
  persist();
  toast(`Impor selesai: ${bmhpUpd+bmhpAdd} item BMHP (${bmhpAdd} baru), ${tndUpd+tndAdd} tindakan (${tndAdd} baru), ${ddUpd} parameter data dasar diperbarui.`);
  render();
}

// ---------- events ----------
document.addEventListener('click', e=>{
  const t=e.target.closest('button,[data-tarif],[data-macc],[data-macc2]'); if(!t) return; const d=t.dataset;
  if(d.go){ view=d.go; closeDrawerSoft(); render(); window.scrollTo(0,0); return; }
  if(d.tarif){ selTarif=d.tarif; showDrawer(); document.getElementById('sheet').innerHTML=tarifDrawer(d.tarif); return; }
  if(d.close){ closeDrawer(); return; }
  if(d.tndedit){ const t0=TND.find(x=>x.kode===d.tndedit); tndDraft={...t0, _orig:t0.kode}; showDrawer(); document.getElementById('sheet').innerHTML=tndDrawer(); return; }
  if(d.tndnew){ tndDraft={kode:'',nama:'',kelompok:'',sub:'',dokter:'',acuan:'',sdm:0,sarana:0,bmhp:0,oh:0}; showDrawer(); document.getElementById('sheet').innerHTML=tndDrawer(); return; }
  if(d.tndsave){
    const kode=(tndDraft.kode||'').trim();
    if(!kode || !tndDraft.nama){ toast('Isi kode dan nama tindakan.'); return; }
    if(tndDraft._orig){
      const t0=TND.find(x=>x.kode===tndDraft._orig);
      Object.assign(t0,{kode,nama:tndDraft.nama,kelompok:tndDraft.kelompok,sub:tndDraft.sub,dokter:tndDraft.dokter,acuan:tndDraft.acuan,sdm:+tndDraft.sdm||0,sarana:+tndDraft.sarana||0,bmhp:+tndDraft.bmhp||0,oh:+tndDraft.oh||0});
    }else{
      if(TND.some(x=>x.kode===kode)){ toast('Kode tindakan sudah dipakai.'); return; }
      TND.push({no:TND.length+1,kode,nama:tndDraft.nama,kelompok:tndDraft.kelompok||'-',sub:tndDraft.sub||null,dokter:tndDraft.dokter||null,acuan:tndDraft.acuan||null,sdm:+tndDraft.sdm||0,sarana:+tndDraft.sarana||0,bmhp:+tndDraft.bmhp||0,oh:+tndDraft.oh||0,te:[null,null,null,null,null],margin:S.classMargins.slice()});
    }
    persist(); toast('Tindakan disimpan.'); closeDrawer(); return;
  }
  if(d.tnddel){ if(confirm('Hapus tindakan '+tndDraft.kode+'?')){ TND=TND.filter(x=>x.kode!==tndDraft._orig); persist(); toast('Tindakan dihapus.'); closeDrawer(); } return; }
  if(d.bmhpnew){ bmhpDraft={nama:'',satuan:'',harga:0,jenis:'',lokasi:''}; showDrawer(); document.getElementById('sheet').innerHTML=bmhpDrawerHtml(); return; }
  if(d.bmhpsave){
    if(!bmhpDraft.nama){ toast('Isi nama item.'); return; }
    BMHP.push({no:BMHP.length+1,nama:bmhpDraft.nama,satuan:bmhpDraft.satuan||null,harga:+bmhpDraft.harga||0,jenis:bmhpDraft.jenis||null,lokasi:bmhpDraft.lokasi||null});
    persist(); toast('Item BMHP ditambahkan.'); closeDrawer(); return;
  }
  if(d.bdel){ if(confirm('Hapus item ini dari Master Obat & BMHP?')){ BMHP=BMHP.filter(x=>String(x.no)!==String(d.bdel)); persist(); toast('Item dihapus.'); render(); } return; }
  if(d.xlsBmhp){ exportBmhp(); return; }
  if(d.xlsTarif){ exportTarif(); return; }
  if(d.applymargin){ const m=[0,1,2,3,4].map(i=>{const el=document.getElementById('sm_'+i); return (+el.value||0)/100}); S.classMargins=m; TND.forEach(t=>t.margin=m.slice()); persist(); toast('Margin default diterapkan ke seluruh tindakan.'); render(); return; }
  if(d.resetall){ if(confirm('Kembalikan seluruh data ke bawaan aplikasi? Perubahan yang sudah dibuat akan hilang.')) resetAll(); return; }
  if(d.macc!=null){ e.preventDefault(); const el=document.getElementById('mac-'+d.macc); if(el){ document.querySelectorAll('.acc-item').forEach(x=>{if(x!==el)x.open=false}); el.open=true; el.scrollIntoView({behavior:'smooth',block:'start'}); } return; }
});
function closeDrawerSoft(){ document.getElementById('drawer').hidden=true; selTarif=null; selTnd=null; tndDraft=null; bmhpDraft=null; }
document.getElementById('drawer').addEventListener('click', e=>{ if(e.target.id==='drawer') closeDrawer(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !document.getElementById('drawer').hidden) closeDrawer(); });
document.addEventListener('input', e=>{
  const el=e.target, d=el.dataset;
  if(d.f!=null){
    if(el.dataset.f==='q'){ fl.q=el.value; }
    else if(el.dataset.f==='kelompok'){ fl.kelompok=el.value; }
    else if(el.dataset.f==='qb'){ flB.q=el.value; }
    else if(el.dataset.f==='jenisb'){ flB.jenis=el.value; }
    const p=el.selectionStart, id=el.id||null;
    clearTimeout(document._ft); document._ft=setTimeout(()=>{ render(); if(id){ const i=document.getElementById(id); if(i){ i.focus(); if(p!=null) try{i.setSelectionRange(p,p)}catch(e){} } } },150);
    return;
  }
  if(d.tmargin!=null && selTarif){ const t=TND.find(x=>x.kode===selTarif); t.margin[+d.tmargin]=(+el.value||0)/100; persist(); document.getElementById('sheet').innerHTML=tarifDrawer(selTarif); return; }
  if(d.tte!=null && selTarif){ const t=TND.find(x=>x.kode===selTarif); const v=el.value.trim(); t.te[+d.tte]=v===''?null:+v; persist(); document.getElementById('sheet').innerHTML=tarifDrawer(selTarif); return; }
  if(d.tf!=null && tndDraft){ tndDraft[d.tf]=el.value; if(['sdm','sarana','bmhp','oh'].includes(d.tf)){ document.getElementById('sheet').innerHTML=tndDrawer(); } return; }
  if(d.bf!=null && bmhpDraft){ bmhpDraft[d.bf]=el.value; return; }
  if(d.bh!=null){ const b=BMHP.find(x=>String(x.no)===d.bh); if(b){ b.harga=+el.value||0; persist(); } return; }
  if(d.dd!=null){ const [sec,idx]=d.dd.split('|'); const secObj=DD.find(s=>s.key===sec); if(secObj){ const it=secObj.items[+idx]; const num2=parseFloat(el.value.replace(/[^0-9.\-]/g,'')); it.val = isNaN(num2)?el.value:num2; persist(); } return; }
  if(d.vol!=null){ const [i,k]=d.vol.split('|'); VOL[+i][k]=+el.value||0; persist(); return; }
  if(d.sm!=null){ return; }
  if(d.meta!=null){ META[d.meta]= d.meta==='tahun'? (+el.value||META.tahun) : el.value; persist(); return; }
});
document.addEventListener('change', async e=>{
  if(e.target.id==='impFile' && e.target.files[0]){
    const f=e.target.files[0]; document.getElementById('impLbl').textContent='Memproses '+f.name+'…';
    await importFile(f);
    const lbl=document.getElementById('impLbl'); if(lbl) lbl.textContent='Pilih file Excel (.xlsx/.xls/.xlsm)';
  }
});

load();
render();
})();
</script>

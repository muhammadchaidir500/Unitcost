*,*::before,*::after{box-sizing:inherit}

html,body{margin:0;height:100%}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent-2)}

.nav{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;padding:20px 14px;overflow-y:auto}
.brand{padding:0 8px 16px;border-bottom:1px solid var(--line);margin-bottom:10px;display:flex;gap:10px;align-items:flex-start}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px}
.brand b{display:block;font-size:15.5px;line-height:1.25;letter-spacing:-.01em}
.brand span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.nav .grp{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}

.nav button .ic{width:19px;text-align:center;flex:none;font-size:15px}
.nav .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:12px 8px 0;border-top:1px solid var(--line)}
.sync{display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--ok)}
main{min-width:0;padding:26px clamp(16px,3vw,40px) 60px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
h1{font-size:clamp(21px,2.4vw,28px);line-height:1.15;margin:0;letter-spacing:-.02em;font-weight:800}
h2{font-size:16.5px;margin:0 0 12px;letter-spacing:-.01em}
h3{font-size:14.5px;margin:0 0 8px}
.lede{color:var(--muted);margin:6px 0 0;max-width:72ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .v{font-size:24px;font-weight:800;margin-top:4px;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--muted);margin-top:3px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:9px;cursor:pointer;font-weight:700;font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.gh{border-color:transparent;background:transparent}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:100px;font-size:12px;font-weight:700}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.na{background:var(--surface-2);color:var(--muted)}
.small{font-size:13px}
.xs{font-size:11.5px}
.muted{color:var(--muted)}
.note{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:13px;margin-top:10px}
.empty{padding:26px;text-align:center;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;font-size:14px}
.field input:focus,.field select:focus{border-color:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input[type="search"]{flex:1;min-width:180px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 12px;font-size:14px}
.filters select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 10px;font-size:13.5px}
.tw{overflow-x:auto;margin:0 -2px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.num{text-align:right;font-variant-numeric:tabular-nums}
th.num{text-align:right}
td input[type="number"],td input[type="text"]{width:100%;min-width:90px;border:1px solid transparent;background:transparent;border-radius:7px;padding:5px 7px;font-size:13.5px}
td input[type="number"]:hover,td input[type="text"]:hover{border-color:var(--line)}
td input[type="number"]:focus,td input[type="text"]:focus{border-color:var(--accent);background:var(--surface)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.bars{display:flex;flex-direction:column;gap:9px}
.bars .r{display:grid;grid-template-columns:130px 1fr 100px;align-items:center;gap:10px;font-size:13px}
.bars .track{position:relative;height:9px;border-radius:100px;background:var(--surface-2);overflow:visible}
.bars .track i{position:absolute;inset:0;border-radius:100px;background:var(--accent)}
@media (max-width:520px){.bars .r{grid-template-columns:100px 1fr 70px}}
.meter{position:relative;height:10px;border-radius:100px;background:var(--surface-2);margin:10px 0 22px}
.meter .fill{height:100%;border-radius:100px}
.meter .tgt{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.meter .tgt span{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em}
.big small{font-size:16px;font-weight:700;color:var(--muted)}
.drop{display:grid;gap:6px;justify-items:start;border:1.5px dashed var(--line);border-radius:12px;padding:20px;cursor:pointer;background:var(--surface-2)}
.drop:hover{border-color:var(--accent)}
.drop input{font-size:13px}
.acc-item{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.acc-h{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:var(--surface);padding:14px 16px;cursor:pointer;font-weight:700;font-size:14.5px}
.acc-h:hover{background:var(--surface-2)}
.acc-h .car{margin-left:auto;transition:transform .15s;color:var(--muted)}
.acc-item[open] .acc-h .car{transform:rotate(180deg)}
.acc-b{padding:2px 16px 18px;font-size:14px;color:var(--ink)}
.acc-b p{margin:8px 0}
.acc-b ul,.acc-b ol{margin:8px 0;padding-left:20px}
.acc-b li{margin:4px 0}
.acc-b code{background:var(--surface-2);padding:1px 6px;border-radius:5px;font-size:.92em}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.toc a{border:1px solid var(--line);border-radius:100px;padding:6px 13px;font-size:12.5px;font-weight:700;color:var(--ink);text-decoration:none;background:var(--surface)}
.toc a:hover{background:var(--surface-2)}
.step-num{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:inline-grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.drawer{position:fixed;inset:0;z-index:50;background:rgba(10,18,16,.45);display:flex;justify-content:flex-end}
.drawer[hidden]{display:none}

.sect{margin-top:16px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function checks(){
  const out=[]; const add=(t,items)=>out.push({t,n:items.length,items:items.slice(0,6)});
  const dup=(list,k)=>{const s={},d=[];list.forEach(x=>{const v=x[k];if(v==null||v==='')return;if(s[v])d.push(v);s[v]=1});return d};
  const set=(list,k)=>new Set(list.map(x=>x[k]));
  const pb=set(M.pb,'kode'),pr=set(M.prof,'kode'),ru=set(M.ruang,'kode'),ob=set(M.obat,'kode'),ti=set(M.tind,'kode'),kat=set(M.kat,'kode'),pola=set(M.pola,'nama'),kel=set(M.kel,'nama');
  add('Kode pusat biaya ganda',dup(M.pb,'kode'));
  add('Kode profesi ganda',dup(M.prof,'kode'));
  add('Kode ruang ganda',dup(M.ruang,'kode'));
  add('Kode item obat/BMHP ganda',dup(M.obat,'kode'));
  add('Kode tindakan ganda',dup(M.tind,'kode'));
  add('Ruangan dengan pusat biaya yang tidak ada',M.ruang.filter(r=>!pb.has(r.pb)).map(r=>r.kode));
  add('Ruangan tanpa pola layanan yang valid',M.ruang.filter(r=>!pola.has(r.pola)).map(r=>r.kode));
  add('Alat dengan kode ruang yang tidak ada',M.alat.filter(a=>!ru.has(a.ruang)).map(a=>a.nama));
  add('Alat dengan kategori yang tidak ada',M.alat.filter(a=>!kat.has(a.kat)).map(a=>a.nama));
  add('Overhead dengan pusat biaya yang tidak ada',M.oh.filter(o=>!pb.has(o.pb)).map(o=>o.kode));
  add('Statistik dengan pusat biaya yang tidak ada',M.stat.filter(s=>!pb.has(s.kode)).map(s=>s.kode));
  add('Tindakan dengan kelompok belum dipetakan',M.tind.filter(t=>!kel.has(t.kel)).map(t=>t.kode));
  add('Kelompok tindakan dengan unit final yang tidak ada',M.kel.filter(k=>!pb.has(k.pb)).map(k=>k.nama));
  add('Aktivitas SDM dengan tindakan tidak ada',M.asdm.filter(x=>!ti.has(x.t)).map(x=>x.t));
  add('Aktivitas SDM dengan profesi tidak ada',M.asdm.filter(x=>!pr.has(x.p)).map(x=>x.p||'(kosong)'));
  add('Okupansi ruang dengan tindakan tidak ada',M.aruang.filter(x=>!ti.has(x.t)).map(x=>x.t));
  add('Okupansi ruang dengan ruangan tidak ada',M.aruang.filter(x=>!ru.has(x.r)).map(x=>x.r||'(kosong)'));
  add('Pemakaian BMHP dengan tindakan tidak ada',M.abmhp.filter(x=>!ti.has(x.t)).map(x=>x.t));
  add('Pemakaian BMHP dengan item tidak ada',M.abmhp.filter(x=>!ob.has(x.b)).map(x=>x.b||'(kosong)'));
  const hasSdm=set(M.asdm,'t'); add('Tindakan tanpa aktivitas SDM',M.tind.filter(t=>!hasSdm.has(t.kode)).map(t=>t.kode));
  add('Unit final tanpa volume kegiatan',M.pb.filter(p=>/^Final/.test(p.jenis)&&!(+p.vol>0)).map(p=>p.nama));
  add('Peringatan step-down (AIC)',C.aic.warn);
  return out;
}

function sheetFor(wb,sch){
  const want=nz(sch.sheet.replace(/^\d+_/,''));
  const name=wb.SheetNames.find(n=>nz(n.replace(/^\d+_/,''))===want);
  return name?wb.Sheets[name]:null;
}
function readTable(ws,sch){
  const ref=XLSX.utils.decode_range(ws['!ref']||'A1:A1');
  const cell=(r,c)=>ws[XLSX.utils.encode_cell({r,c})];
  const fields=sch.cols.filter(c=>c.k);
  let hdrRow=-1,map=null;
  for(let r=ref.s.r;r<=Math.min(ref.e.r,12);r++){
    const heads=[]; for(let c=ref.s.c;c<=ref.e.c;c++){const x=cell(r,c); heads.push(x?nz(x.v):'');}
    const m={}, used={};
    const take=(f,pred)=>{ if(m[f.k]!=null)return; for(let i=0;i<heads.length;i++){ if(used[i]||!heads[i])continue; if(pred(heads[i])){m[f.k]=i+ref.s.c;used[i]=1;return;} } };
    fields.forEach(f=>take(f,h=>f.a.some(a=>h===a)));
    fields.forEach(f=>take(f,h=>f.a.some(a=>h.startsWith(a))));
    const key0=fields[0];
    if(m[key0.k]!=null && Object.keys(m).length>=Math.min(2,fields.length)){hdrRow=r;map=m;break;}
  }
  if(hdrRow<0)return null;
  const rows=[];
  for(let r=hdrRow+1;r<=ref.e.r;r++){
    const g=k=>{const c=map[k]; return c==null?undefined:cell(r,c);};
    const kf=fields[0]; const kc=g(kf.k); const kv=kc?toTxt(kc.v):null;
    if(sch.key==='alat'||sch.key==='stat'){ if(!kv)continue; }
    else if(!kv)continue;
    if(/^(isi|otomatis)$/i.test(kv))continue;
    rows.push({r,g});
  }
  return {rows,map,hdrRow};
}
function importWorkbook(wb){
  const out={}, rep=[], warn=[];
  const pbRow={};
  // 06 lebih dulu untuk memetakan rumus tautan volume
  const order=['pb'].concat(SCHEMA.map(s=>s.key).filter(k=>k!=='pb'));
  order.forEach(key=>{
    const sch=SCHEMA.find(s=>s.key===key); const ws=sheetFor(wb,sch); if(!ws)return;
    const tb=readTable(ws,sch); if(!tb){warn.push(`Sheet ${sch.sheet}: judul kolom tidak dikenali, dilewati.`);return;}
    const list=[];
    tb.rows.forEach(({r,g})=>{
      const o={};
      sch.cols.forEach(c=>{
        if(!c.k)return; const x=g(c.k);
        switch(c.t){
          case 'txt': o[c.k]=x?toTxt(x.v):null; break;
          case 'num': o[c.k]=x?toNum(x.v):null; break;
          case 'num0': o[c.k]=x?(toNum(x.v)||0):0; break;
          case 'lnkHK': { const f=x&&x.f; if(f&&/HARI_KERJA/i.test(f))o[c.k]='HARI_KERJA'; else if(x&&typeof x.v==='string'&&/HARI_KERJA/i.test(x.v))o[c.k]='HARI_KERJA'; else o[c.k]=x?toNum(x.v):null; break; }
          case 'lnkLOS': { const f=x&&x.f; if(f&&/^\s*=?\s*LOS\s*$/i.test(f))o[c.k]='LOS'; else if(x&&typeof x.v==='string'&&/^\s*=?LOS\s*$/i.test(x.v))o[c.k]='LOS'; else { const v=x?toNum(x.v):null; o[c.k]=v==null?1:v; } break; }
          case 'lnkPB': { const f=x&&x.f; let tok=null;
            if(f){ const m=/06_Pusat_Biaya'?!\$?G\$?(\d+)(\s*\*\s*LOS)?/i.exec(f); if(m&&pbRow[+m[1]]) tok=pbRow[+m[1]]+(m[2]?'*LOS':''); }
            if(tok==null&&x&&typeof x.v==='string'&&/^PB\d+(\*LOS)?$/i.test(x.v.trim())) tok=x.v.trim().toUpperCase();
            o[c.k]=tok!=null?tok:(x?(toNum(x.v)||0):0); break; }
          case 'te': { o.te=o.te||[null,null,null,null,null]; o.te[c.n]=x?toNum(x.v):null; break; }
        }
      });
      if(key==='pb') pbRow[r+1]=o.kode;
      // nilai bawaan agar sheet lama tetap terbaca
      if(key==='pb'){ if(o.urut==null)o.urut=list.length+1; if(o.lang==null)o.lang=0; }
      if(key==='stat'){ ['pegawai','kg','tindakan','ranap','harirawat','kunjRJ','resep','periksa'].forEach(k=>{if(o[k]==null)o[k]=0;}); }
      if(key==='alat'){ if(!o.basis)o.basis='Tetap'; if(o.jml==null)o.jml=1; }
      if(key==='ruang'){ if(o.jml==null)o.jml=1; if(o.sim==null)o.sim=1; }
      if(key==='asdm'||key==='aruang'){ if(o.fr==null)o.fr=1; }
      if(key==='abmhp'){ if(o.jml==null)o.jml=1; if(o.pro==null)o.pro=1; }
      if(key==='prof'){ if(o.jam==null)o.jam=+((out.profil||M.profil).JAM_KERJA_DEF)||8; if(o.hilang==null)o.hilang=+((out.profil||M.profil).MENIT_HILANG_DEF)||0; }
      list.push(o);
    });
    if(key==='pb'&&!tb.map.lang) warn.push('Sheet 06_Pusat_Biaya belum memiliki kolom “Biaya Langsung Lain – SDM & Operasional”: nilainya dianggap 0. Gunakan template terbaru agar biaya ini ikut terhitung.');
    if(key==='kelas'){ // pertahankan 5 kelas
      const k5=[]; for(let i=0;i<5;i++){const s=list[i]||{}; k5.push({kode:s.kode||('K'+(i+1)),nama:s.nama||'',margin:s.margin==null?null:s.margin});} out[key]=k5;
    } else out[key]=list;
    rep.push(`${sch.title}: ${list.length} baris`);
  });
  // profil
  const wsP=wb.SheetNames.find(n=>nz(n.replace(/^\d+_/,''))==='profilrs');
  if(wsP){
    const ws=wb.Sheets[wsP], ref=XLSX.utils.decode_range(ws['!ref']||'A1:A1'); const P=clone(M.profil); let n=0;
    for(let r=ref.s.r;r<=ref.e.r;r++){
      const a=ws[XLSX.utils.encode_cell({r,c:0})]; if(!a)continue; const code=String(a.v||'').trim();
      if(!PROFIL_ROWS.some(x=>x[0]===code)||PROFIL_AUTO.includes(code))continue;
      const v=ws[XLSX.utils.encode_cell({r,c:2})];
      P[code]=PROFIL_TXT.includes(code)?(v?toTxt(v.v):null):(v?toNum(v.v):null); n++;
    }
    out.profil=P; rep.push(`Profil & parameter: ${n} nilai`);
  }
  if(!rep.length) throw new Error('Tidak ada sheet yang dikenali. Gunakan file Master_Data_UnitCost_TDABC.xlsx atau Template_Kosong_UnitCost_TDABC.xlsx.');
  return {out,rep,warn};
}
async function importFile(file){
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array',cellFormula:true,cellDates:false});
    const {out,rep,warn}=importWorkbook(wb);
    Object.keys(out).forEach(k=>{M[k]=out[k];});
    if(out.kelas&&!M.kelas.length)M.kelas=out.kelas;
    META={importedAt:Date.now(),importedName:file.name}; recalc(); persist(); render();
    const box=document.getElementById('impRes');
    if(box) box.innerHTML=`<div class="note" style="background:var(--ok-soft)"><b>Impor berhasil</b> dari ${esc(file.name)}<ul style="margin:6px 0 0 18px">${rep.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>${warn.length?`<div class="note" style="background:var(--warn-soft);margin-top:8px">${warn.map(esc).join('<br>')}</div>`:''}<p class="small muted">Periksa menu <a href="#" data-go="cek">Cek Data</a> untuk memastikan semua kode saling cocok.</p>`;
    toast('Impor selesai: '+rep.length+' bagian data diperbarui.');
  }catch(err){
    console.error(err);
    const box=document.getElementById('impRes'); if(box) box.innerHTML=`<div class="note" style="background:var(--bad-soft)"><b>Impor gagal.</b> ${esc(err.message||err)}</div>`;
    toast('Impor gagal: '+(err.message||err));
  }
}

const CASC={
  pola:[['ruang','pola']], kat:[['alat','kat']], pb:[['ruang','pb'],['stat','kode'],['oh','pb'],['kel','pb']],
  prof:[['asdm','p']], ruang:[['alat','ruang'],['aruang','r']], obat:[['abmhp','b']], tind:[['asdm','t'],['aruang','t'],['abmhp','t']],
  kel:[['tind','kel']], dasar:[['pb','dasar']],

function cascadeRename(tb,oldV,newV){
  (CASC[tb]||[]).forEach(([t,f])=>M[t].forEach(r=>{ if(r[f]===oldV) r[f]=newV; }));
  if(tb==='pb'){ const re=new RegExp('^'+oldV.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(\\*LOS)?$'); M.stat.forEach(s=>['pegawai','kg','tindakan','ranap','harirawat','kunjRJ','resep','periksa'].forEach(k=>{ const m=typeof s[k]==='string'&&re.exec(s[k]); if(m) s[k]=newV+(m[1]||''); })); }
}
function applyField(el){
  const tb=el.dataset.t,i=+el.dataset.i,k=el.dataset.k; const r=M[tb]&&M[tb][i]; if(!r)return false;
  const cfg=colOf(tb,k); if(!cfg)return false; let v=el.value;
  switch(cfg.t){
    case 'num': r[k]=v===''?null:+v; break;
    case 'pct': r[k]=v===''?null:+v/100; break;
    case 'lnk': r[k]=v===''?0:+v; el.classList.remove('lnk'); el.removeAttribute('data-lk'); break;
    case 'text': r[k]=(v===''&&!cfg.key)?null:v; break;
    default: r[k]=v;
  }
  return true;
}

  if(d.tndopen){ selTnd=d.tndopen; openSheet(tindDrawer(selTnd)); return; }
  if(d.tndnew){ let n=M.tind.length+1,kode; do{kode='TND-'+String(n++).padStart(3,'0');}while(M.tind.some(x=>x.kode===kode)); M.tind.push({kode,nama:'Tindakan baru',kel:(M.kel[0]||{}).nama||'',sub:null,dokter:null,acuan:null,sumber:null,te:[null,null,null,null,null]}); recalc(); persist(); selTnd=kode; PG.tindakan=1e9; render(); openSheet(tindDrawer(kode)); return; }
  if(d.tnddel){ if(!armDelete(t,'Yakin hapus?'))return; const k=d.tnddel; M.tind=M.tind.filter(x=>x.kode!==k); ['asdm','aruang','abmhp'].forEach(n=>M[n]=M[n].filter(x=>x.t!==k)); recalc(); persist(); closeDrawer(); toast('Tindakan dihapus.'); return; }
  if(d.addline){ const [tb,k]=d.addline.split('|'); M[tb].push(TB[tb].blank(k)); recalc(); persist(); renderDrawer(); return; }
  if(d.xlsMaster){ exportMaster(d.xlsMaster); return; }
  if(d.xlsTarif){ exportTarif(); return; }
  if(d.resetall){ if(!armDelete(t,'Yakin? Data lama hilang'))return; M=d.resetall==='blank'?blankM():clone(SEED); META={importedAt:null,importedName:null}; recalc(); persist(); view='ringkasan'; render(); toast(d.resetall==='blank'?'Data dikosongkan.':'Data dikembalikan ke bawaan.'); return; }
  if(d.relink){ M.stat.forEach(s=>{ const p=M.pb.find(x=>x.kode===s.kode); if(!p)return; const j=/^Final/.test(p.jenis); if(!j)return; if(p.jenis==='Final Rawat Inap'){ s.ranap=s.kode; s.harirawat=s.kode+'*LOS'; } else { s.kunjRJ=s.kode; } }); recalc(); persist(); render(); toast('Tautan volume dipulihkan.'); return; }
  const trr=e.target.closest('tr[data-tarif]'); if(trr){ selTarif=trr.dataset.tarif; selTnd=null; openSheet(tarifDrawer(selTarif)); }
});
document.getElementById('drawer').addEventListener('click',e=>{ if(e.target.id==='drawer')closeDrawer(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!document.getElementById('drawer').hidden)closeDrawer(); if(e.key==='Enter'&&e.target.matches&&e.target.matches('tr[data-tarif]')){ selTarif=e.target.dataset.tarif; selTnd=null; openSheet(tarifDrawer(selTarif)); } });
window.addEventListener('beforeunload',()=>{ try{persist();}catch(e){} });

// ---------- boot ----------
load(); render();
window.__app={get M(){return M},get C(){return C},recalc,importWorkbook,buildWorkbook,checks,render,setView:v=>{view=v;render()}};
})();
</script>
